name: Publish v0.1.3

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-v0.1.3.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build install archive
        run: |
          cd mod
          zip -r ../DragonFantasyCity-v0.1.3.zip DragonFantasyCity
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.3 DragonFantasyCity-v0.1.3.zip \
            --target "$GITHUB_SHA" \
            --title "龙与奇幻城：命运铸牌 / Dragon Fantasy City: Forged by Fate — v0.1.3" \
            --notes-file RELEASE_NOTES.md

